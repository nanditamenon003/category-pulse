[theme]
base = "light"
# Accent for interactive elements only (buttons, links, selected states): the logo's violet.
primaryColor = "#4F3FB7"
backgroundColor = "#F7F7F5"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1A1A1A"
font = "sans serif"

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[browser]
gatherUsageStats = false
